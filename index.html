<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 18th Vippy ❤️</title>
  <style>
    :root{--bg:#0f0710;--bg2:#1d0d1f;--pink:#ff77b7;--rose:#ff4f9a;--text:#ffeaf5;--glass:rgba(255,255,255,.09)}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:radial-gradient(circle at top,var(--bg2),var(--bg));color:var(--text);font-family: "Trebuchet MS", "Segoe UI", sans-serif;scroll-behavior:smooth}
    .screen{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
    .card{width:min(920px,95vw);background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    h1,h2{margin:.2rem 0 1rem;font-weight:700;letter-spacing:.4px}
    .sub{opacity:.9;line-height:1.5}
    .center{text-align:center}
    .btn{border:none;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--rose));padding:14px 26px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(255,85,160,.35);transition:transform .2s,box-shadow .2s}
    .btn:active{transform:scale(.97)} .btn:hover{transform:translateY(-2px)}
    .heart{display:inline-block;animation:heartbeat 1.35s infinite}
    @keyframes heartbeat{0%,100%{transform:scale(1)}20%{transform:scale(1.12)}35%{transform:scale(.98)}55%{transform:scale(1.08)}}

    #entry .card{max-width:520px}
    #countdownWrap{display:none}
    .timer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
    .timeBox{min-width:82px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25)}
    .timeBox b{font-size:1.4rem;display:block}

    #main{display:none;padding:0}
    .layout{display:grid;grid-template-columns:1fr;min-height:100svh}
    .hero{padding:20px 16px 92px;position:relative}

    .slideshow{position:fixed;inset:0;z-index:-2}
    .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;transform:scale(1);background-size:cover;background-position:center center;animation:kenburns 14s ease-in-out infinite}
    .slide.active{opacity:.36}
    @keyframes kenburns{0%{transform:scale(1)}100%{transform:scale(1.12)}}
    .overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(12,5,12,.72),rgba(18,9,19,.9));z-index:-1}

    .floatingCaption{font-size:.92rem;opacity:.9;text-align:center;padding:8px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:999px;display:inline-block;margin-bottom:12px}
    .letter{line-height:1.76;font-size:1.04rem;white-space:pre-wrap;min-height:260px}
    .cursor{display:inline-block;width:10px;background:var(--pink);margin-left:4px;animation:blink .9s infinite}
    @keyframes blink{50%{opacity:0}}

    .controls{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:9}
    .mini{border:none;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.25);color:#fff;padding:10px 14px;border-radius:999px;cursor:pointer}

    #final{display:none;min-height:100svh;align-items:center;justify-content:center;text-align:center;padding:24px}
    #final h2{font-size:clamp(1.8rem,5vw,3rem)}
    #final p{font-size:clamp(1rem,3vw,1.3rem);opacity:.9}

    canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

    @media (min-width:760px){.hero{padding:26px 24px 96px}.letter{font-size:1.14rem}}
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <section class="screen" id="entry">
    <div class="card center">
      <h1>For Vipashyana <span class="heart">❤️</span></h1>
      <p class="sub">A small universe made from our moments. Tap when you're ready.</p>
      <button class="btn" id="startBtn">Tap to Begin ❤️</button>

      <div id="countdownWrap">
        <p class="sub" style="margin-top:18px">Something special is about to begin…</p>
        <div class="timer" id="timer"></div>
      </div>
    </div>
  </section>

  <section id="main">
    <div class="slideshow" id="slideshow"></div>
    <div class="overlay"></div>
    <div class="layout">
      <div class="hero">
        <div class="card">
          <div class="floatingCaption" id="caption">From then… to now ❤️</div>
          <h2>My Letter to Vippy</h2>
          <div class="letter" id="letter"></div><span class="cursor" id="cursor"></span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="mini" id="musicToggle">Music: Off</button>
      <button class="mini" id="skipFinal">Final Screen</button>
    </div>
  </section>

  <section id="final" class="screen">
    <div class="card center">
      <h2>Happy 18th Birthday Vippy ❤️</h2>
      <p>This is just the beginning…</p>
    </div>
  </section>

  <audio id="bgm" loop preload="auto"></audio>

<script>
const targetDate = new Date('2026-05-05T00:00:00');
const images = [
  'images/01.jpg','images/02.jpg','images/03.jpg','images/04.jpg','images/05.jpg','images/06.jpg',
  'images/07.jpg','images/08.jpg','images/09.jpg','images/10.jpg','images/11.jpg','images/12.jpg',
  'images/13.jpg','images/14.jpg','images/15.jpg','images/16.jpg','images/17.jpg','images/18.jpg'
];
const captions = [
  'From then… to now ❤️', 'Every moment = priceless', 'School days, soft smiles, forever memories',
  'You grew, and somehow I fell deeper', 'My favorite glow-up story is you', 'Us — still my safest place'
];
const letterText = `Vippy,

You turned 18 today, and I keep thinking about how beautifully time has moved with us.
I still remember meeting you when you were 16 — shy in some moments, fierce in others, and already impossible to forget.

I have watched you grow year by year, not just in age, but in strength.
The way you handle things quietly, the way you care deeply, the way you still keep your cute little expressions even when you pretend to be serious — that balance is so you.

You are special in a way that can't be copied.
You make ordinary days feel warm.
You make hard days feel lighter.
And without even trying, you make me want to become better.

Thank you for every laugh, every call, every memory that sits in my heart like a soft light.
Thank you for trusting me with your world.

At 18, you're stepping into a new chapter.
I just want you to know this — I am proud of you, I admire you, and I want to keep growing beside you.
Not rushing anything. Just choosing each other, again and again.

Happy Birthday, my Vippy.
You are loved. You are seen. You are my favorite story.`;

const startBtn = document.getElementById('startBtn');
const countdownWrap = document.getElementById('countdownWrap');
const timer = document.getElementById('timer');
const main = document.getElementById('main');
const entry = document.getElementById('entry');
const letter = document.getElementById('letter');
const caption = document.getElementById('caption');
const final = document.getElementById('final');
const cursor = document.getElementById('cursor');
const bgm = document.getElementById('bgm');
const musicToggle = document.getElementById('musicToggle');

let musicOn = false; let countdownInt;

function updateCountdown(){
  const now = new Date();
  const diff = targetDate - now;
  if(diff <= 0){ clearInterval(countdownInt); revealMain(); return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff%86400000/3600000);
  const m = Math.floor(diff%3600000/60000);
  const s = Math.floor(diff%60000/1000);
  timer.innerHTML = [['Days',d],['Hours',h],['Mins',m],['Secs',s]].map(([l,v])=>`<div class="timeBox"><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`).join('');
}

function revealMain(){
  entry.style.display='none';
  main.style.display='block';
  buildSlideshow();
  startTypewriter();
  burstConfetti(220);
}

function buildSlideshow(){
  const wrap = document.getElementById('slideshow');
  images.forEach((src, i)=>{
    const el = document.createElement('div');
    el.className = 'slide' + (i===0 ? ' active':'' );
    el.style.backgroundImage = `url('${src}')`;
    el.style.animationDelay = `${i%4}s`;
    wrap.appendChild(el);
  });
  let idx = 0;
  setInterval(()=>{
    const slides = [...document.querySelectorAll('.slide')];
    slides[idx].classList.remove('active');
    idx = (idx + 1) % slides.length;
    slides[idx].classList.add('active');
    caption.textContent = captions[idx % captions.length];
  }, 4200);
}

function startTypewriter(){
  let i = 0;
  const speed = 31;
  const t = setInterval(()=>{
    letter.textContent += letterText[i++] || '';
    if(i >= letterText.length){
      clearInterval(t);
      cursor.style.display='none';
      burstConfetti(300);
      setTimeout(()=>final.style.display='flex', 3500);
    }
  }, speed);
}

startBtn.addEventListener('click', async () => {
  countdownWrap.style.display='block';
  startBtn.style.display='none';
  bgm.src = 'music/romantic-instrumental.mp3'; // place your mp3 file here
  try { await bgm.play(); musicOn = true; musicToggle.textContent='Music: On'; } catch(e){}
  updateCountdown();
  countdownInt = setInterval(updateCountdown, 1000);
});

musicToggle.addEventListener('click', async () => {
  if(!bgm.src) return;
  if(musicOn){ bgm.pause(); musicOn=false; musicToggle.textContent='Music: Off'; }
  else { try { await bgm.play(); musicOn=true; musicToggle.textContent='Music: On'; } catch(e){} }
});

document.getElementById('skipFinal').addEventListener('click', ()=> final.style.display='flex');

const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
let pieces = [];
function resize(){confettiCanvas.width=innerWidth;confettiCanvas.height=innerHeight}
addEventListener('resize',resize); resize();
function burstConfetti(count){
  for(let i=0;i<count;i++) pieces.push({
    x:Math.random()*confettiCanvas.width,y:Math.random()*-confettiCanvas.height,
    r:Math.random()*6+2,c:["#ffd1ea","#ff96cb","#fff2c7","#ffc0f2"][Math.floor(Math.random()*4)],
    v:Math.random()*2+1,a:Math.random()*Math.PI*2,s:Math.random()*0.08+0.01
  });
}
(function anim(){
  ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  pieces = pieces.filter(p=>p.y < confettiCanvas.height+20);
  pieces.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+=p.s);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r*1.7);});
  requestAnimationFrame(anim);
})();
</script>
</body>
</html>
